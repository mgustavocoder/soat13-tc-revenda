openapi: 3.0.3
info:
  title: soat13-tc-revenda API
  description: API REST para plataforma de revenda de veículos automotores
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Ambiente local

tags:
  - name: Health
    description: Verificação de saúde da API
  - name: Clientes
    description: Gerenciamento de clientes
  - name: Veículos
    description: Gerenciamento de veículos
  - name: Vendas
    description: Compra de veículos

paths:

  /api/health:
    get:
      tags: [Health]
      summary: Verifica saúde da API
      responses:
        '200':
          description: API operacional
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: 1.0.0

  /api/clientes:
    get:
      tags: [Clientes]
      summary: Lista todos os clientes
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'

    post:
      tags: [Clientes]
      summary: Cadastra um novo cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteInput'
            example:
              nome: Maria Silva
              cpf: "12345678901"
              email: maria@email.com
      responses:
        '201':
          description: Cliente cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          description: Dados inválidos (nome, CPF ou e-mail)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: CPF ou e-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/clientes/{cpf}:
    get:
      tags: [Clientes]
      summary: Busca cliente pelo CPF
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{11}$'
          example: "12345678901"
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          description: CPF inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Cliente não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/veiculos:
    post:
      tags: [Veículos]
      summary: Cadastra um veículo para venda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeiculoInput'
            example:
              marca: Toyota
              modelo: Corolla
              ano: 2022
              cor: Branco
              placa: ABC1D23
              preco: 85000
      responses:
        '201':
          description: Veículo cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Veiculo'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/veiculos/disponiveis:
    get:
      tags: [Veículos]
      summary: Lista veículos disponíveis para venda, ordenados por preço crescente
      responses:
        '200':
          description: Lista de veículos disponíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Veiculo'
              example:
                - placa: DEF2E34
                  marca: Honda
                  modelo: Civic
                  ano: 2021
                  cor: Prata
                  preco: 75000
                  status: DISPONIVEL
                - placa: ABC1D23
                  marca: Toyota
                  modelo: Corolla
                  ano: 2022
                  cor: Branco
                  preco: 85000
                  status: DISPONIVEL

  /api/veiculos/reservados:
    get:
      tags: [Veículos]
      summary: Lista veículos reservados, ordenados por preço crescente
      responses:
        '200':
          description: Lista de veículos reservados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Veiculo'
              example:
                - placa: ABC1D23
                  marca: Toyota
                  modelo: Corolla
                  ano: 2022
                  cor: Branco
                  preco: 85000
                  status: RESERVADO

  /api/veiculos/vendidos:
    get:
      tags: [Veículos]
      summary: Lista veículos vendidos, ordenados por preço crescente
      responses:
        '200':
          description: Lista de veículos vendidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Veiculo'

  /api/veiculos/{placa}:
    get:
      tags: [Veículos]
      summary: Busca veículo pela placa
      parameters:
        - name: placa
          in: path
          required: true
          schema:
            type: string
          example: ABC1D23
      responses:
        '200':
          description: Veículo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Veiculo'
        '400':
          description: Placa inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Veículo não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    put:
      tags: [Veículos]
      summary: Edita dados de um veículo disponível
      description: |
        Atualiza parcialmente os dados do veículo. Apenas veículos com status
        `DISPONIVEL` podem ser editados. Informe pelo menos um campo.
      parameters:
        - name: placa
          in: path
          required: true
          schema:
            type: string
          example: ABC1D23
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeiculoUpdateInput'
            example:
              preco: 80000
              cor: Prata
      responses:
        '200':
          description: Veículo atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Veiculo'
        '400':
          description: Dados inválidos ou veículo já vendido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Veículo não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/vendas:
    get:
      tags: [Vendas]
      summary: Lista todas as vendas cadastradas
      responses:
        '200':
          description: Lista de vendas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VendaResponse'

  /api/vendas/reservar:
    post:
      tags: [Vendas]
      summary: Reserva um veículo para o cliente
      description: |
        A reserva deve ocorrer antes da confirmação de pagamento.
        O cliente identificado pelo CPF deve estar previamente cadastrado.
        O veículo deve estar com status `DISPONIVEL`.
        Quando a reserva é criada, a venda fica em `AGUARDANDO_PAGAMENTO` e o veículo passa para `RESERVADO`.
        Um veículo não pode ter mais de uma reserva ativa ao mesmo tempo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendaInput'
            example:
              veiculoPlaca: ABC1D23
              clienteCpf: "12345678901"
      responses:
        '201':
          description: Veículo reservado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendaResponse'
        '400':
          description: Dados inválidos ou campos obrigatórios ausentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Cliente ou veículo não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Veículo não disponível para venda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/vendas/{codigo}/cancelar:
    post:
      tags: [Vendas]
      summary: Cancela uma reserva existente
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            pattern: '^VEN-[A-Z0-9]+$'
          example: VEN-7F3G2A1M
      responses:
        '200':
          description: Reserva cancelada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendaResponse'

  /api/vendas/{codigo}/confirmar-pagamento:
    post:
      tags: [Vendas]
      summary: Confirma o pagamento da reserva e finaliza a compra
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            pattern: '^VEN-[A-Z0-9]+$'
          example: VEN-7F3G2A1M
      responses:
        '200':
          description: Pagamento confirmado e venda finalizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendaResponse'

components:
  schemas:

    ClienteInput:
      type: object
      required: [nome, cpf, email]
      properties:
        nome:
          type: string
          minLength: 3
          example: Maria Silva
        cpf:
          type: string
          pattern: '^\d{11}$'
          description: 11 dígitos numéricos, sem pontuação
          example: "12345678901"
        email:
          type: string
          format: email
          example: maria@email.com

    Cliente:
      description: Resposta pública do cliente. Não expõe o id interno do banco.
      allOf:
        - $ref: '#/components/schemas/ClienteInput'

    VeiculoInput:
      type: object
      required: [marca, modelo, ano, cor, placa, preco]
      properties:
        marca:
          type: string
          example: Toyota
        modelo:
          type: string
          example: Corolla
        ano:
          type: integer
          minimum: 1886
          example: 2022
        cor:
          type: string
          example: Branco
        placa:
          type: string
          example: ABC1D23
        preco:
          type: number
          format: float
          minimum: 0.01
          example: 85000

    VeiculoUpdateInput:
      type: object
      description: Pelo menos um campo deve ser informado
      properties:
        marca:
          type: string
          example: Toyota
        modelo:
          type: string
          example: Corolla Cross
        ano:
          type: integer
          minimum: 1886
          example: 2023
        cor:
          type: string
          example: Prata
        placa:
          type: string
          example: ABC1D23
        preco:
          type: number
          format: float
          minimum: 0.01
          example: 80000

    Veiculo:
      description: Resposta pública do veículo. Não expõe o id interno do banco.
      type: object
      required: [marca, modelo, ano, cor, placa, preco, status]
      properties:
        marca:
          type: string
          example: Toyota
        modelo:
          type: string
          example: Corolla
        ano:
          type: integer
          example: 2022
        cor:
          type: string
          example: Branco
        placa:
          type: string
          example: ABC1D23
        preco:
          type: number
          format: float
          example: 85000
        status:
          type: string
          enum: [DISPONIVEL, RESERVADO, VENDIDO]
          example: DISPONIVEL

    VendaInput:
      type: object
      required: [veiculoPlaca, clienteCpf]
      properties:
        veiculoPlaca:
          type: string
          example: ABC1D23
        clienteCpf:
          type: string
          pattern: '^\d{11}$'
          example: "12345678901"

    VendaResponse:
      description: Resposta pública da venda. Não expõe os ids internos do banco.
      type: object
      properties:
        codigo:
          type: string
          pattern: '^VEN-[A-Z0-9]+$'
          example: VEN-7F3G2A1M
          description: Código público da venda
        veiculoPlaca:
          type: string
          example: ABC1D23
        clienteCpf:
          type: string
          example: "12345678901"
        preco:
          type: number
          format: float
          example: 85000
        status:
          type: string
          enum: [AGUARDANDO_PAGAMENTO, CANCELADA, PAGAMENTO_CONFIRMADO]
          example: AGUARDANDO_PAGAMENTO
        dataVenda:
          type: string
          format: date-time
        veiculo:
          $ref: '#/components/schemas/Veiculo'
        cliente:
          type: object
          properties:
            nome:
              type: string
              example: Maria Silva
            cpf:
              type: string
              example: "12345678901"
            email:
              type: string
              example: maria@email.com

    Erro:
      type: object
      properties:
        message:
          type: string
          example: Mensagem descritiva do erro
